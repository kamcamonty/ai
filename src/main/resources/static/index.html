<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Research Agent | Ciklum AI Academy</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f8f9fa;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 { color: #1a73e8; margin-bottom: 10px; }
        .header p { color: #666; font-size: 0.9em; }

        .search-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #1a73e8;
        }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        /* Reasoning Trace Styling */
        #reasoning-section {
            display: none;
            background: #f1f3f4;
            border-left: 4px solid #1a73e8;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
        }
        .section-title {
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5f6368;
            margin-bottom: 10px;
            display: block;
        }
        #reasoning-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            color: #3c4043;
        }

        /* Results Styling */
        #result-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: none;
        }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-weight: 600;
            color: #1a73e8;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Bio-Research Assistant</h1>
    <p>Ciklum AI Academy Project | Agentic RAG with Self-Reflection</p>
</div>

<div class="search-container">
    <input type="text" id="queryInput" placeholder="Enter scientific query (e.g. Metformin AMPK HepG2 dosage)...">
    <button id="searchBtn" onclick="performAnalysis()">Analyze Literature</button>
    <div id="loader" class="loader">Agent is thinking and searching PubMed...</div>
</div>

<div id="reasoning-section">
    <span class="section-title">Agent Reasoning & Reflection</span>
    <div id="reasoning-text"></div>
</div>

<div id="result-container">
    <span class="section-title">Scientific Synthesis</span>
    <div id="answer-content"></div>
</div>

<script>
    async function performAnalysis() {
        const query = document.getElementById('queryInput').value;
        const btn = document.getElementById('searchBtn');
        const loader = document.getElementById('loader');
        const reasoningSection = document.getElementById('reasoning-section');
        const resultContainer = document.getElementById('result-container');

        if (!query) return;

        // UI State management
        btn.disabled = true;
        loader.style.display = 'block';
        reasoningSection.style.display = 'none';
        resultContainer.style.display = 'none';

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();

            // 1. Display Reasoning & Reflection
            reasoningSection.style.display = 'block';
            document.getElementById('reasoning-text').innerText =
                `PLAN: ${data.reasoning}\n\nREFLECTION: ${data.reflection}`;

            // 2. Display Rendered Markdown Answer
            resultContainer.style.display = 'block';
            document.getElementById('answer-content').innerHTML = marked.parse(data.answer);

        } catch (error) {
            console.error('Error:', error);
            alert("Failed to reach the research agent.");
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>
</body>
</html>
